name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout project
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug assembleRelease --no-daemon

    - name: Rename APKs
      run: |
        mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/neo-kiosk.apk
        mv app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/neo-kiosk-release-unsigned.apk

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: neo-kiosk
        path: app/build/outputs/apk/debug/neo-kiosk.apk

    - name: Upload Release APK (Unsigned)
      uses: actions/upload-artifact@v4
      with:
        name: neo-kiosk-release-unsigned
        path: app/build/outputs/apk/release/neo-kiosk-release-unsigned.apk
