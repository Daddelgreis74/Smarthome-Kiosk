AutoName: Neo Kiosk
Summary: Smart Home Kiosk & Wallpanel App mit Neo Aurora Design
Description: |-
  Neo Kiosk verwandelt dein Android-Tablet oder Smartphone in ein voll ausgestattetes Smart Home Wand-Terminal.
  Optimiert für das Smart Home Dashboard mit Neo Aurora Design, lokaler REST-Fernsteuerungs-API, optischer Bewegungserkennung und integrierter J.A.R.V.I.S. Sprachunterstützung.

